<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#283887">
  <meta name="description" content="A guided Digital Electronics learning lab with clear theory, diagrams and practice.">
  <title>TattvaLab — Digital Electronics</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #283887;
      --blue-dark: #1d2a68;
      --red: #a21d2e;
      --ink: #202d55;
      --muted: #53617b;
      --line: #ced2df;
      --paper: #e9e9eb;
      --canvas: #e1e2e6;
      --font: "Metropolis", "Segoe UI", Aptos, system-ui, sans-serif;
      --slab: "Zilla Slab", Georgia, serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 90px; }
    body { margin: 0; color: var(--ink); background: var(--canvas); font: 16px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    a { color: inherit; text-decoration: none; }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #4b93d2; outline-offset: 3px; }
    .shell { width: min(1180px, calc(100% - 48px)); margin: 0 auto; }
    .topbar { position: sticky; z-index: 10; top: 0; border-bottom: 1px solid #d0d3dc; background: rgb(234 234 236 / 94%); backdrop-filter: blur(14px); }
    .topbar__inner { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: inline-flex; align-items: center; gap: 11px; color: var(--ink); font-size: 22px; font-weight: 760; letter-spacing: -.06em; }
    .brand__mark { width: 40px; height: 40px; display: grid; place-items: center; color: #fff; border-radius: 13px; background: linear-gradient(140deg, var(--blue), #5b2d64 63%, var(--red)); box-shadow: 0 5px 13px #28388730; }
    .brand__mark svg { width: 25px; height: 25px; }
    .nav { display: flex; align-items: center; gap: 25px; color: #4e5b75; font-size: 14px; font-weight: 650; }
    .nav a:hover { color: var(--red); }
    .nav__cta, .button { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 0 17px; border: 0; border-radius: 10px; font-weight: 700; cursor: pointer; transition: transform .18s ease, box-shadow .18s ease; }
    .nav__cta { color: #fff; background: linear-gradient(110deg, var(--blue), #71314f); }
    .button:hover, .nav__cta:hover { transform: translateY(-2px); }
    .button--light { color: var(--blue-dark); background: #fff; box-shadow: 0 8px 20px #121c4830; }
    .button--primary { color: #fff; background: linear-gradient(110deg, var(--blue), #71314f 70%, var(--red)); box-shadow: 0 8px 19px #2838872b; }
    .button--outline { color: var(--blue); border: 1px solid #c8ccda; background: #f1f1f2; }
    .button--small { min-height: 40px; padding-inline: 13px; font-size: 14px; }
    .hero { position: relative; isolation: isolate; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(330px, .8fr); align-items: center; gap: 42px; min-height: 485px; margin-top: 28px; padding: clamp(34px, 6vw, 74px); overflow: hidden; color: #fff; border-radius: 28px; background: radial-gradient(circle at 85% 15%, #ffffff24, transparent 27%), radial-gradient(ellipse at 86% 112%, #a21d2e9c, transparent 46%), linear-gradient(118deg, #1d2a68, #283887 58%, #49254d); box-shadow: 0 24px 55px #202d7026; }
    .hero::before { position: absolute; z-index: -1; inset: 0; opacity: .13; background-image: linear-gradient(#ffffff40 1px, transparent 1px), linear-gradient(90deg, #ffffff40 1px, transparent 1px); background-size: 40px 40px; mask-image: linear-gradient(105deg, transparent 8%, #000 90%); content: ""; }
    .kicker { display: inline-flex; align-items: center; gap: 10px; color: #e2def1; font-size: 12px; font-weight: 800; letter-spacing: .12em; }
    .kicker i { width: 8px; height: 8px; border-radius: 50%; background: #df7584; box-shadow: 0 0 0 5px #df758422; }
    .hero h1 { max-width: 690px; margin: 19px 0 17px; color: #fff; font-size: clamp(43px, 6vw, 72px); letter-spacing: -.07em; line-height: 1.04; }
    .hero h1 em { color: #ffc4ce; font: 500 1em/1.05 var(--slab); }
    .hero__copy > p { max-width: 560px; margin: 0; color: #e0e5f6; font-size: 18px; line-height: 1.75; }
    .hero__actions { display: flex; flex-wrap: wrap; align-items: center; gap: 13px 20px; margin-top: 27px; }
    .hero__link, .plain-link { display: inline-flex; align-items: center; gap: 8px; color: #fff; font-size: 15px; font-weight: 700; }
    .hero__link:hover { color: #ffc4ce; }
    .hero__facts { display: flex; flex-wrap: wrap; gap: 13px; align-items: center; margin-top: 31px; color: #d4dcf0; font-size: 13px; }
    .hero__facts strong { color: #fff; font-size: 17px; }
    .hero__facts i { width: 4px; height: 4px; border-radius: 50%; background: #de8594; }
    .logic-card { padding: 22px; border: 1px solid #ffffff2c; border-radius: 20px; background: linear-gradient(145deg, #111b49ba, #182249e8); box-shadow: 0 22px 52px #08102a4a; transform: rotate(.7deg); }
    .logic-card__head, .logic-card__head span { display: flex; align-items: center; }
    .logic-card__head { justify-content: space-between; gap: 10px; color: #cbd5ef; font-size: 10px; font-weight: 800; letter-spacing: .13em; }
    .logic-card__head span { gap: 8px; }
    .logic-card__head i { width: 7px; height: 7px; border-radius: 50%; background: #df7584; }
    .logic-card__prompt { display: grid; gap: 4px; margin: 21px 0 16px; }
    .logic-card__prompt span { color: #bac7e3; font-size: 13px; }
    .logic-card__prompt strong { font-size: 19px; }
    .logic-circuit { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px; border: 1px solid #ffffff20; border-radius: 13px; background: #ffffff0b; }
    .logic-circuit__inputs { display: grid; gap: 10px; }
    .logic-circuit__inputs span { display: flex; align-items: center; gap: 9px; color: #e0e6f6; font-size: 14px; }
    .logic-circuit__inputs i { width: 8px; height: 8px; border-radius: 50%; background: #7586bb; }
    .logic-circuit__inputs i.on { background: #e37f8e; box-shadow: 0 0 10px #e37f8e9c; }
    .logic-circuit__inputs b { margin-left: auto; }
    .logic-circuit svg { width: 105px; color: #aec2e8; }
    .logic-circuit__out { display: grid; justify-items: center; color: #fff; }
    .logic-circuit__out strong { font-size: 25px; }
    .logic-circuit__out small { color: #bcc9e4; font-size: 10px; letter-spacing: .1em; }
    .logic-rule { display: flex; justify-content: space-between; align-items: center; margin-top: 13px; padding: 11px 13px; border-left: 3px solid #c54a5e; border-radius: 0 9px 9px 0; background: #ffffff0d; }
    .logic-rule span { color: #cbd5ef; font-size: 10px; font-weight: 750; letter-spacing: .1em; }
    .logic-rule strong { font-size: 18px; }
    .mini-truth { width: 100%; margin-top: 10px; border-spacing: 1px; border: 1px solid #ffffff20; border-radius: 9px; overflow: hidden; text-align: center; font-size: 12px; }
    .mini-truth th, .mini-truth td { padding: 4px; background: #1b2854; }
    .mini-truth th { color: #e6a8b1; font-size: 11px; }
    .section { margin-top: 70px; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .eyebrow { color: var(--red); font-size: 11px; font-weight: 800; letter-spacing: .11em; }
    .section-head h2 { margin: 6px 0 0; color: var(--blue-dark); font-size: clamp(29px, 3.5vw, 42px); letter-spacing: -.055em; line-height: 1.15; }
    .section-head p { max-width: 420px; margin: 0; color: var(--muted); }
    .path-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
    .path-card { position: relative; padding: 21px; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: linear-gradient(135deg, #e9e9eb, #dcdee4); }
    .path-card::after { position: absolute; top: -65px; right: -55px; width: 140px; height: 140px; border: 1px solid #28388724; border-radius: 50%; box-shadow: 0 0 0 18px #28388708, 0 0 0 36px #28388705; content: ""; }
    .path-card__number { color: #8089a0; font-size: 12px; font-weight: 800; letter-spacing: .12em; }
    .path-card h3 { position: relative; z-index: 1; margin: 8px 0 4px; color: var(--blue-dark); font-size: 20px; letter-spacing: -.035em; }
    .path-card p { position: relative; z-index: 1; max-width: 480px; margin: 0; color: var(--muted); font-size: 14px; }
    .path-card__links { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
    .path-card__links button { padding: 6px 10px; color: var(--blue); border: 1px solid #c9cedd; border-radius: 999px; background: #ffffff82; font-size: 12px; font-weight: 650; cursor: pointer; }
    .path-card__links button:hover { color: #fff; border-color: var(--blue); background: var(--blue); }
    .lab-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .lab-card { display: flex; min-width: 0; flex-direction: column; padding: 0 17px 16px; overflow: hidden; border: 1px solid #cfd2dc; border-radius: 16px; background: #e9e9eb; box-shadow: 0 7px 18px #202d700b; transition: transform .18s ease, box-shadow .18s ease; }
    .lab-card:hover { transform: translateY(-4px); box-shadow: 0 15px 28px #202d7019; }
    .lab-card__art { position: relative; display: flex; min-height: 128px; flex-direction: column; justify-content: space-between; margin: 0 -17px; padding: 15px 17px; overflow: hidden; color: #fff; background: radial-gradient(circle at 80% 40%, #ffffff2b, transparent 36%), linear-gradient(125deg, #1d2a68, #283887 60%, #672a4d); }
    .lab-card__art::after { position: absolute; right: -37px; bottom: -78px; width: 165px; height: 165px; border: 1px solid #ffffff35; border-radius: 50%; box-shadow: 0 0 0 17px #ffffff0a, 0 0 0 34px #ffffff07; content: ""; }
    .lab-card__number { position: relative; z-index: 1; color: #e0e4f3; font-size: 10px; font-weight: 800; letter-spacing: .13em; }
    .lab-card__art strong { position: relative; z-index: 1; font: 500 clamp(24px, 3vw, 34px)/1.1 var(--slab); }
    .lab-card__category { margin-top: 14px; color: var(--red); font-size: 10px; font-weight: 800; letter-spacing: .06em; }
    .lab-card h3 { min-height: 50px; margin: 6px 0; color: var(--blue-dark); font-size: 19px; letter-spacing: -.035em; line-height: 1.3; }
    .lab-card p { flex: 1; margin: 0 0 13px; color: #4d5a72; font-size: 14px; line-height: 1.65; }
    .lab-card__meta { display: flex; justify-content: space-between; gap: 8px; padding: 10px 0; color: #59647a; border-top: 1px solid #ced1d9; font-size: 12px; }
    .lab-card__open { display: flex; justify-content: space-between; padding-top: 10px; color: var(--blue); border-top: 1px solid #ced1d9; font-size: 14px; font-weight: 750; }
    .lab-top { display: flex; align-items: center; gap: 8px; margin: 19px 0 12px; color: var(--blue); font-size: 13px; }
    .lab-top button { display: inline-flex; align-items: center; gap: 7px; padding: 5px 0; color: inherit; border: 0; background: none; font-weight: 700; cursor: pointer; }
    .lab-hero { display: grid; grid-template-columns: minmax(0, 1fr) 275px; align-items: center; gap: 35px; padding: clamp(26px, 5vw, 52px); color: #fff; border-radius: 24px; background: radial-gradient(circle at 90% 13%, #ffffff24, transparent 27%), radial-gradient(ellipse at 85% 112%, #a21d2e9c, transparent 48%), linear-gradient(116deg, #1d2a68, #283887 60%, #4d254c); box-shadow: 0 18px 40px #202d7025; }
    .lab-hero__tag { color: #e7cbd4; font-size: 11px; font-weight: 800; letter-spacing: .12em; }
    .lab-hero h1 { margin: 13px 0 10px; color: #fff; font-size: clamp(36px, 5vw, 58px); letter-spacing: -.065em; line-height: 1.06; }
    .lab-hero h1 span { color: #ffbac5; }
    .lab-hero p { max-width: 690px; margin: 0; color: #e1e6f5; font-size: 16px; line-height: 1.7; }
    .lab-hero__meta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 17px; color: #d8deef; font-size: 13px; }
    .lab-hero__actions { display: flex; flex-wrap: wrap; gap: 10px 17px; margin-top: 21px; }
    .lab-hero__direct { display: inline-flex; align-items: center; gap: 7px; padding: 8px 0; color: #fff; border: 0; background: none; font-size: 14px; font-weight: 700; cursor: pointer; }
    .lab-route { display: grid; gap: 14px; padding: 18px; border: 1px solid #ffffff2a; border-radius: 16px; background: #111b496e; }
    .lab-route > span { color: #d4ddef; font-size: 10px; font-weight: 800; letter-spacing: .13em; }
    .lab-route__item { display: flex; align-items: center; gap: 10px; }
    .lab-route__item b { display: grid; width: 31px; height: 31px; place-items: center; border: 1px solid #ffffff38; border-radius: 9px; background: #ffffff12; font-size: 11px; }
    .lab-route__item span { display: grid; }
    .lab-route__item strong { font-size: 13px; }
    .lab-route__item small { color: #cbd4e9; font-size: 11px; }
    .workflow { margin-top: 20px; overflow: visible; border: 1px solid #ccd0da; border-radius: 19px; background: #e9e9eb; box-shadow: 0 15px 40px #202d7010; scroll-margin-top: 88px; }
    .workflow__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 25px 15px; }
    .workflow__head .eyebrow { font-size: 10px; }
    .workflow__head h2 { margin: 4px 0 1px; color: var(--blue-dark); font-size: 24px; letter-spacing: -.04em; }
    .workflow__head p { margin: 0; color: #626c80; font-size: 13px; }
    .workflow__count { display: flex; align-items: center; gap: 6px; color: #667188; font-size: 10px; font-weight: 750; letter-spacing: .1em; white-space: nowrap; }
    .workflow__count strong { color: var(--blue); font-size: 20px; }
    .stepper { position: sticky; z-index: 8; top: 76px; display: flex; gap: 2px; padding: 0 15px; overflow-x: auto; border-block: 1px solid #d0d2da; background: #e9e9ebed; scrollbar-width: thin; scrollbar-color: #aeb5cc transparent; }
    .stepper button { position: relative; display: flex; min-width: 84px; flex: 1 0 auto; align-items: center; justify-content: center; gap: 7px; min-height: 54px; padding: 6px; color: #657089; border: 0; background: transparent; font-size: 12px; font-weight: 650; cursor: pointer; }
    .stepper button::after { position: absolute; right: 5px; bottom: -1px; left: 5px; height: 3px; background: transparent; content: ""; }
    .stepper button.is-active { color: var(--blue-dark); }
    .stepper button.is-active::after { background: linear-gradient(90deg, var(--blue), var(--red)); }
    .stepper button > i { display: grid; width: 25px; height: 25px; flex: 0 0 auto; place-items: center; color: var(--blue); border: 1px solid #c4c9d8; border-radius: 50%; background: #f1f1f2; font-size: 9px; font-style: normal; }
    .stepper button.is-active > i, .stepper button.is-done > i { color: #fff; border-color: var(--blue); background: linear-gradient(140deg, var(--blue), var(--red)); }
    .workflow__content { min-height: 350px; padding: clamp(18px, 3vw, 32px); }
    .aim-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(240px, .75fr); gap: 25px; }
    .status { display: inline-flex; margin-bottom: 16px; padding: 6px 10px; color: var(--blue); border: 1px solid #c7cbd9; border-radius: 999px; background: #dedfe5; font-size: 10px; font-weight: 800; letter-spacing: .05em; }
    .aim h3 { max-width: 760px; margin: 9px 0; color: var(--blue-dark); font-size: clamp(26px, 3.2vw, 36px); letter-spacing: -.05em; line-height: 1.25; }
    .aim > p { max-width: 750px; color: #4e5b74; font-size: 16px; line-height: 1.75; }
    .objective { display: grid; margin: 21px 0; border-top: 1px solid var(--line); }
    .objective > div { display: grid; grid-template-columns: 35px 1fr; gap: 10px; padding: 13px 0; border-bottom: 1px solid var(--line); }
    .objective > div > b { color: var(--red); font-size: 12px; }
    .objective p { margin: 0; color: #536079; font-size: 14px; }
    .objective strong { display: block; color: var(--ink); }
    .side-card, .detail-card { padding: 18px; border: 1px solid #d0d2da; border-radius: 15px; background: linear-gradient(140deg, #dedfe5, #eeeeef); }
    .side-card h4, .detail-card h4 { margin: 5px 0 10px; color: var(--blue-dark); font-size: 19px; }
    .clean-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .clean-list li { display: flex; align-items: start; gap: 8px; color: #4c5972; font-size: 14px; line-height: 1.55; }
    .clean-list li::before { color: var(--red); content: "✓"; font-weight: 800; }
    .theory-opening { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(220px, .75fr); gap: 13px; margin-bottom: 16px; }
    .theory-opening__copy { padding: 20px; border: 1px solid #d0d2db; border-radius: 15px; background: linear-gradient(125deg, #dedfe5, #ebebed); }
    .theory-opening h3 { margin: 7px 0; color: var(--blue-dark); font-size: 23px; letter-spacing: -.04em; line-height: 1.3; }
    .theory-opening p { margin: 0; color: #4b5871; font-size: 15px; line-height: 1.75; }
    .learning-goal { display: grid; align-content: center; gap: 9px; padding: 19px; color: #fff; border-radius: 15px; background: linear-gradient(140deg, #283887, #343267); }
    .learning-goal span { color: #f0b8c1; font-size: 10px; font-weight: 800; letter-spacing: .11em; }
    .learning-goal strong { font-size: 14px; line-height: 1.6; }
    .diagram { margin: 16px 0 20px; padding: 16px; border: 1px solid #cdd0da; border-radius: 16px; background: #dedfe4; }
    .diagram__heading { display: grid; gap: 4px; margin-bottom: 12px; }
    .diagram__heading strong { color: var(--blue-dark); font-size: 17px; }
    .diagram__canvas { overflow-x: auto; border: 1px solid #d2d4dc; border-radius: 12px; background: #ebebed; scrollbar-width: thin; }
    .diagram__canvas svg { display: block; width: 100%; min-width: 570px; height: auto; }
    .diagram-box { fill: #f2f2f3; stroke: #283887; stroke-width: 2; }
    .diagram-line { fill: none; stroke: #6976ab; stroke-width: 2; }
    .diagram-node { fill: #28304d; font: 700 18px var(--font); }
    .diagram-small { fill: #a21d2e; font: 800 13px var(--font); letter-spacing: 1px; }
    .diagram-hint { margin: 8px 0 0; color: #59657b; font-size: 12px; }
    .formula-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 17px 0; padding: 17px; border: 1px solid #c9ccda; border-left: 5px solid var(--red); border-radius: 13px; background: linear-gradient(105deg, #daddE5, #ebebed); }
    .formula-row__label { width: 100%; color: var(--red); font-size: 10px; font-weight: 800; letter-spacing: .12em; }
    .formula { padding: 7px 10px; color: var(--blue); border: 1px solid #c8ccda; border-radius: 8px; background: #ededee; font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
    .chapters { display: grid; gap: 10px; margin: 21px 0; }
    .chapter { display: grid; grid-template-columns: 43px 1fr; gap: 13px; padding: 16px; border: 1px solid #d0d2da; border-radius: 14px; background: #e1e2e6; }
    .chapter__number { display: grid; width: 39px; height: 39px; place-items: center; color: #fff; border-radius: 12px; background: linear-gradient(140deg, var(--blue), #54305c); font-size: 13px; font-weight: 800; }
    .chapter h4 { margin: 3px 0 5px; color: var(--blue-dark); font-size: 18px; letter-spacing: -.03em; }
    .chapter p { margin: 0; color: #4d5a72; font-size: 15px; line-height: 1.75; }
    .highlights { display: grid; grid-template-columns: .9fr 1.25fr; gap: 12px; margin: 20px 0; }
    .fact-card { padding: 19px; color: #fff; border-radius: 15px; background: radial-gradient(circle at 100% 0, #ffffff26, transparent 42%), linear-gradient(135deg, var(--blue), #303262); }
    .fact-card p { margin: 9px 0 0; font-size: 16px; font-weight: 630; line-height: 1.6; }
    .key-card { padding: 19px; border: 1px solid #d0d2da; border-radius: 15px; background: #dedfe4; }
    .key-card .clean-list { margin-top: 10px; }
    .example-card { margin: 18px 0; padding: 19px; border: 1px solid #d0d2da; border-radius: 15px; background: linear-gradient(110deg, #ebebed, #dedfe4); }
    .example-card h4 { margin: 4px 0 6px; color: var(--blue-dark); font-size: 19px; }
    .example-card p { margin: 0; color: #4d5a72; font-size: 15px; line-height: 1.75; }
    .observation-table { width: 100%; margin-top: 10px; border-collapse: collapse; overflow: hidden; border-radius: 12px; }
    .observation-table th, .observation-table td { padding: 9px 12px; border: 1px solid #cfd2dc; text-align: left; }
    .observation-table th { color: #fff; background: var(--blue); font-size: 13px; }
    .observation-table td { color: #40506c; font-size: 14px; }
    .observation-table tr:nth-child(even) td { background: #dedfe4; }
    .note { color: #626d81; font-size: 12px; }
    .procedure-list { display: grid; gap: 9px; margin: 18px 0; padding: 0; list-style: none; counter-reset: procedure; }
    .procedure-list li { display: grid; grid-template-columns: 38px 1fr; gap: 11px; padding: 14px; border: 1px solid #d0d2da; border-radius: 13px; background: #e1e2e6; counter-increment: procedure; }
    .procedure-list li::before { display: grid; width: 33px; height: 33px; place-items: center; color: #fff; border-radius: 10px; background: var(--blue); font-size: 11px; font-weight: 800; content: counter(procedure, decimal-leading-zero); }
    .procedure-list p { margin: 0; color: #4d5a72; font-size: 15px; }

          <svg viewBox="0 0 106 74" role="img" aria-label="Two inputs connected to an AND gate"><path d="M13 10h32a27 27 0 0 1 0 54H13z" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M0 25h13M0 49h13M72 37h25" stroke="currentColor" stroke-width="2.6"/><circle cx="5" cy="25" r="3" fill="#e37f8e"/><circle cx="5" cy="49" r="3" fill="#91a0c2"/></svg>
          <div class="logic-circuit__out"><strong>Y = 0</strong><small>LOW</small></div></div>
        <div class="logic-rule"><span>BOOLEAN RULE</span><strong>Y = A · B</strong></div>
        <table class="mini-truth"><thead><tr><th>A</th><th>B</th><th>Y</th></tr></thead><tbody><tr><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>1</td><td>0</td></tr><tr><td>1</td><td>0</td><td>0</td></tr><tr><td>1</td><td>1</td><td>1</td></tr></tbody></table>
      </aside>`;
    }

    const paths = [
      { name: "Start with logic", description: "Learn binary rules and the electrical signals behind them.", slugs: ["logic-gate-explorer", "digital-logic-families"] },
      { name: "Combine and calculate", description: "Select, decode, compare and do binary arithmetic.", slugs: ["multiplexer-logic-design", "decoder-logic-design", "digital-comparator", "adders-and-subtractors", "bcd-7-segment-decoder"] },
      { name: "Store and move bits", description: "See how clocked circuits remember data and shift it.", slugs: ["flip-flops", "shift-registers"] },
      { name: "Put the pieces together", description: "Meet the ALU at the heart of a processor datapath.", slugs: ["arithmetic-logic-unit"] },
    ];

    function renderHome() {
      const pathCards = paths.map((path, index) => {
        const links = path.slugs.map((slug) => {
          const lab = labs.find((item) => item.slug === slug);
          return lab ? `<button data-action="open" data-slug="${safe(slug)}">${safe(lab.title)} ↗</button>` : "";
        }).join("");
        return `<article class="path-card"><span class="path-card__number">0${index + 1}</span><h3>${safe(path.name)}</h3><p>${safe(path.description)}</p><div class="path-card__links">${links}</div></article>`;
      }).join("");
      const labCards = labs.map((lab, index) => `<article class="lab-card">
        <div class="lab-card__art"><span class="lab-card__number">MODULE ${String(index + 1).padStart(2, "0")}</span><strong>${safe(moduleMarks[lab.diagram] || lab.category)}</strong></div>
        <span class="lab-card__category">${safe(lab.category)} · ${safe(lab.difficulty)}</span>
        <h3>${safe(lab.title)}</h3><p>${safe(lab.summary)}</p>
        <div class="lab-card__meta"><span>◷ ${safe(lab.duration)} min</span><span>Diagram + theory</span></div>
        ${labButton(lab)}
      </article>`).join("");
      return `${renderHeader()}<main id="main-content" class="shell">
        <section class="hero"><div class="hero__copy"><span class="kicker"><i></i> DIGITAL ELECTRONICS · GUIDED LABS</span>
          <h1>Digital logic, made clear.<br><em>One circuit at a time.</em></h1>
          <p>Explore 10 guided labs with clear theory, circuit diagrams, worked examples and quick checks.</p>
          <div class="hero__actions"><a class="button button--light" href="#catalogue" data-action="catalogue">Explore all 10 labs&nbsp; →</a><button class="hero__link" data-action="open" data-slug="logic-gate-explorer">Start with logic gates&nbsp; ↗</button></div>
          <div class="hero__facts"><span><strong>10</strong> experiments</span><i></i><span><strong>3</strong> learning phases</span><i></i><span>Work at your pace</span></div>
        </div>${renderLogicPreview()}</section>
        <section class="section" id="paths"><div class="section-head"><div><span class="eyebrow">A CLEAR ROUTE THROUGH THE SUBJECT</span><h2>Choose a starting point.</h2></div><p>Follow a learning path, or jump straight to the experiment you need.</p></div><div class="path-grid">${pathCards}</div></section>
        <section class="section" id="catalogue"><div class="section-head"><div><span class="eyebrow">THEORY · DIAGRAMS · PRACTICE</span><h2>All ten experiments.</h2></div><p>Open any module directly. Theory, pre-test, procedure and report are one click away.</p></div><div class="lab-grid">${labCards}</div></section>
        <p class="disclaimer">TattvaLab is an independent learning resource and is not an official Medi-Caps University product or student record.</p>
      </main>${renderFooter()}`;
    }

    function renderFooter() {
      return `<footer class="site-footer"><div class="shell site-footer__inner"><span>Understand. Experiment. Discover. Digital Electronics, explained clearly.</span><a href="#home" data-action="home">TattvaLab</a></div></footer>`;
    }

    function renderDiagram(lab) {
      const labels = diagramTitles[lab.diagram] || ["Inputs", "Logic block", "Output"];
      return `<figure class="diagram"><div class="diagram__heading"><span class="eyebrow">CONCEPT DIAGRAM</span><strong>${safe(lab.category)} · how the signals move</strong></div>
        <div class="diagram__canvas"><svg viewBox="0 0 820 190" role="img" aria-label="${safe(labels.join(" to "))}">
          <defs><marker id="arrow-${safe(lab.slug)}" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L7 3z" fill="#a21d2e"/></marker></defs>
          <text x="48" y="38" class="diagram-small">INPUT / CONTROL</text><text x="340" y="38" class="diagram-small">CIRCUIT IDEA</text><text x="645" y="38" class="diagram-small">WHAT TO OBSERVE</text>
          <rect x="35" y="59" width="205" height="89" rx="14" class="diagram-box"/><text x="137" y="111" text-anchor="middle" class="diagram-node">${safe(labels[0])}</text>
          <path d="M240 103 H310" class="diagram-line" marker-end="url(#arrow-${safe(lab.slug)})"/>
          <rect x="310" y="59" width="205" height="89" rx="14" class="diagram-box"/><text x="412" y="111" text-anchor="middle" class="diagram-node">${safe(labels[1])}</text>
          <path d="M515 103 H585" class="diagram-line" marker-end="url(#arrow-${safe(lab.slug)})"/>
          <rect x="585" y="59" width="205" height="89" rx="14" class="diagram-box"/><text x="687" y="111" text-anchor="middle" class="diagram-node">${safe(labels[2])}</text>
        </svg></div><figcaption class="diagram-hint">Follow the signal from left to right. On a small screen, swipe the diagram sideways.</figcaption></figure>`;
    }

    function renderTheory(lab) {
      const formulas = lab.equation.split(/\s+·\s+/).map((formula) => `<span class="formula">${safe(formula)}</span>`).join("");
      const chapters = lab.theory.map((paragraph, index) => `<article class="chapter"><span class="chapter__number">${String(index + 1).padStart(2, "0")}</span><div><span class="eyebrow">CONCEPT ${String(index + 1).padStart(2, "0")}</span><h4>${safe(chapterTitles[lab.slug]?.[index] || `Build the idea · ${index + 1}`)}</h4><p>${safe(paragraph)}</p></div></article>`).join("");
      const keyPoints = lab.keyPoints.map((point) => `<li>${safe(point)}</li>`).join("");
      const rows = lab.observations.rows.map((row) => `<tr>${row.map((cell) => `<td>${safe(cell)}</td>`).join("")}</tr>`).join("");
      const columns = lab.observations.columns.map((column) => `<th>${safe(column)}</th>`).join("");
      return `<section class="theory-opening"><div class="theory-opening__copy"><span class="eyebrow">FIRST, THE BIG IDEA</span><h3>${safe(lab.aim)}</h3><p>${safe(lab.introduction)}</p></div><aside class="learning-goal"><span>LEARNING GOAL</span><strong>${safe(lab.objective)}</strong></aside></section>
        ${renderDiagram(lab)}
        <div class="formula-row"><span class="formula-row__label">THE CORE RULE</span>${formulas}</div>
        <div class="chapters">${chapters}</div>
        <div class="highlights"><aside class="fact-card"><span class="eyebrow" style="color:#f0b8c1">DID YOU KNOW?</span><p>${safe(lab.quickFact)}</p></aside><section class="key-card"><span class="eyebrow">KEEP THESE IN MIND</span><ul class="clean-list">${keyPoints}</ul></section></div>
        <section class="example-card"><span class="eyebrow">LET’S APPLY IT</span><h4>Worked example</h4><p>${safe(lab.calculationExample)}</p></section>
        <section class="detail-card"><span class="eyebrow">CHECK YOUR UNDERSTANDING</span><h4>Observation table</h4><div style="overflow-x:auto"><table class="observation-table"><thead><tr>${columns}</tr></thead><tbody>${rows}</tbody></table></div><p class="note">${safe(lab.observations.note)}</p></section>
        <section class="detail-card" style="margin-top:14px"><span class="eyebrow">ASSUMPTIONS AND LIMITS</span>${lab.assumptions.map((item) => `<p>${safe(item)}</p>`).join("")}<p class="note">Use the table to practise. The interactive simulation can be added later.</p></section>`;
    }

    function getQuizState(slug, kind) {
      if (!quizSessions[slug]) quizSessions[slug] = {};
      if (!quizSessions[slug][kind]) quizSessions[slug][kind] = { index: 0, answers: {}, submitted: false, score: null };
      return quizSessions[slug][kind];
    }

    function renderQuiz(lab, kind) {
      const questions = kind === "preTest" ? lab.preTest : lab.postTest;
      const state = getQuizState(lab.slug, kind);
      const index = Math.min(state.index, questions.length - 1);
      const question = questions[index];
      const selected = state.answers[question.id];
      const answered = Object.keys(state.answers).length;
      const options = question.options.map((option, optionIndex) => {
        const correct = state.submitted && optionIndex === question.correctOption;
        const wrong = state.submitted && selected === optionIndex && !correct;
        return `<button class="answer ${selected === optionIndex ? "selected" : ""} ${correct ? "correct" : ""} ${wrong ? "wrong" : ""}" data-action="answer" data-kind="${kind}" data-option="${optionIndex}" ${state.submitted ? "disabled" : ""}><span class="answer__key">${String.fromCharCode(65 + optionIndex)}</span><span>${safe(option)}</span></button>`;
      }).join("");
      const allAnswered = questions.every((item) => state.answers[item.id] !== undefined);
      const explanation = state.submitted ? `<div class="explanation"><strong>${selected === question.correctOption ? "That’s right." : "Review the concept."}</strong><p>${safe(question.explanation)}</p></div>` : "";
      const result = state.submitted ? `<div class="explanation"><strong>Your score: ${state.score}/${questions.length}</strong><p>This is an ungraded practice check. Review the explanations as you go.</p></div>` : "";
      const last = index === questions.length - 1;
      return `<div class="assessment"><section class="assessment__intro"><span class="eyebrow">${kind === "preTest" ? "BEFORE THE THEORY" : "AFTER THE THEORY"}</span><h3>${kind === "preTest" ? "What do you already know?" : "What makes more sense now?"}</h3><p>Try each question and read its explanation. Your responses stay in this page session.</p><span class="eyebrow">${questions.length} QUESTIONS · UNGRADED PRACTICE</span></section>
        <section class="quiz"><div class="quiz__progress"><span>QUESTION ${String(index + 1).padStart(2, "0")} / ${String(questions.length).padStart(2, "0")}</span><span>${answered} answered</span></div><h4>${safe(question.prompt)}</h4><div class="answer-list">${options}</div>${explanation}<div class="quiz__foot"><button class="button button--outline button--small" data-action="quiz-prev" data-kind="${kind}" ${index === 0 ? "disabled" : ""}>← Previous</button>
          ${state.submitted ? `<span>Score ${state.score}/${questions.length}</span>` : last ? `<button class="button button--primary button--small" data-action="quiz-submit" data-kind="${kind}" ${allAnswered ? "" : "disabled"}>Submit answers →</button>` : `<button class="button button--primary button--small" data-action="quiz-next" data-kind="${kind}" ${selected === undefined ? "disabled" : ""}>Next →</button>`}</div>${result}</section></div>`;
    }

    function renderStage(lab) {
      switch (activeStage) {
        case "Aim": return `<div class="aim-grid"><section class="aim"><span class="status">THEORY READY · SIMULATION TO FOLLOW</span><span class="eyebrow">THE AIM</span><h3>${safe(lab.aim)}</h3><p>${safe(lab.summary)}</p><div class="objective"><div><b>01</b><p><strong>By the end, you can</strong>${safe(lab.objective)}</p></div><div><b>02</b><p><strong>Time needed</strong>About ${safe(lab.duration)} minutes, at your own pace</p></div></div><section class="detail-card"><span class="eyebrow">WHAT YOU MAY NEED</span><ul class="clean-list">${lab.apparatus.map((item) => `<li>${safe(item)}</li>`).join("")}</ul></section></section><aside class="side-card"><span class="eyebrow">BEFORE YOU BEGIN</span><h4>Helpful prerequisites</h4><ul class="clean-list">${lab.prerequisites.map((item) => `<li>${safe(item)}</li>`).join("")}</ul><p class="note">Read the theory and follow the concept diagram first.</p></aside></div>`;
        case "Theory": return renderTheory(lab);
        case "Pretest": return renderQuiz(lab, "preTest");
        case "Procedure": return `<section><span class="eyebrow">PROCEDURE</span><h3 style="color:var(--blue-dark);margin:7px 0">Work through these steps.</h3><p class="note">Use the concept diagram and observation table to check each result.</p><ol class="procedure-list">${lab.procedure.map((step) => `<li><p>${safe(step)}</p></li>`).join("")}</ol><section class="detail-card"><span class="eyebrow">PRECAUTIONS</span><ul class="clean-list">${lab.precautions.map((item) => `<li>${safe(item)}</li>`).join("")}</ul></section></section>`;
        case "Simulation": return `<section class="simulation-card"><span class="simulation-card__mark">${String(labs.indexOf(lab) + 1).padStart(2, "0")}</span><div><span class="eyebrow">SIMULATION WILL BE ADDED LATER</span><h3>The theory and diagram are ready.</h3><p>Follow the procedure and practise with the observation table for now. This panel is ready for the interactive Replit model when it is available.</p></div></section>`;
        case "Posttest": return renderQuiz(lab, "postTest");
        case "References": return `<section><span class="eyebrow">FURTHER READING</span><h3 style="color:var(--blue-dark);font-size:25px">Explore the topic further</h3><p class="note">These digital-design references cover the ideas in this module with more examples and exercises.</p><ol class="ref-list">${lab.references.map((item) => `<li>${safe(item)}</li>`).join("")}</ol></section>`;
        case "Feedback": return `<form class="feedback" id="feedback-form"><span class="eyebrow">LEARNER FEEDBACK</span><h3>How was this experiment?</h3><p class="note">Your note stays in this browser session. It is not sent to a server.</p><span class="eyebrow">CHOOSE A RATING</span><div class="rating">${[1, 2, 3, 4, 5].map((rating) => `<button type="button" data-action="rating" data-rating="${rating}" class="${feedbackRatings[lab.slug] === rating ? "selected" : ""}" aria-pressed="${feedbackRatings[lab.slug] === rating}">${rating}</button>`).join("")}</div><label for="feedback-note">What would you improve?</label><textarea id="feedback-note" rows="4" placeholder="Share an optional note"></textarea><button class="button button--primary button--small" type="submit" ${feedbackRatings[lab.slug] ? "" : "disabled"}>Save feedback →</button><p id="feedback-status" class="note" aria-live="polite"></p></form>`;
        case "Report": {
          const pre = quizSessions[lab.slug]?.preTest?.score;
          const post = quizSessions[lab.slug]?.postTest?.score;
          return `<section class="report"><div class="report__head"><div><span class="eyebrow">TAT TVALAB · DIGITAL ELECTRONICS</span><h3>Experiment summary</h3><p>${safe(lab.title)}</p></div><button class="button button--outline button--small no-print" data-action="print">Print report</button></div><div class="report__grid"><div class="report__item"><span>AIM</span><p>${safe(lab.aim)}</p></div><div class="report__item"><span>CORE RULE</span><p>${safe(lab.equation)}</p></div><div class="report__item"><span>PRE-TEST</span><p>${pre === undefined ? "Not recorded" : `${pre}/${lab.preTest.length} correct`}</p></div><div class="report__item"><span>POST-TEST</span><p>${post === undefined ? "Not recorded" : `${post}/${lab.postTest.length} correct`}</p></div><div class="report__item"><span>ASSUMPTIONS</span><p>${safe(lab.assumptions.join(" "))}</p></div><div class="report__item"><span>CONCLUSION</span><p>${safe(lab.conclusion)}</p></div></div></section>`;
        }
      }
    }

    function renderLab() {
      const lab = currentLab();
      if (!lab) { activeSlug = null; return renderHome(); }
      const index = labs.indexOf(lab);
      const stageIndex = stages.indexOf(activeStage);
      const stepButtons = stages.map((stage, stageNumber) => `<button class="${stage === activeStage ? "is-active" : ""} ${stageNumber < stageIndex ? "is-done" : ""}" data-action="stage" data-stage="${stage}" aria-current="${stage === activeStage ? "step" : "false"}"><i>${stageNumber < stageIndex ? "✓" : String(stageNumber + 1).padStart(2, "0")}</i>${stage}</button>`).join("");
      const [heading, subheading] = stageCopy[activeStage];
      const nextLabel = activeStage === "Pretest" ? "Continue to procedure" : activeStage === "Posttest" ? "Continue to references" : activeStage === "Feedback" ? "Continue to report" : "Continue";
      return `${renderHeader()}<main id="main-content" class="shell"><div class="lab-top"><button data-action="catalogue">← Digital Electronics</button><span>/</span><span>${safe(lab.title)}</span></div>
        <section class="lab-hero"><div><span class="lab-hero__tag">LAB ${String(index + 1).padStart(2, "0")} · ${safe(lab.category).toUpperCase()}</span><h1>${safe(lab.title)}<span>.</span></h1><p>${safe(lab.summary)}</p><div class="lab-hero__meta"><span>◷ About ${safe(lab.duration)} min</span><span>· ${safe(lab.difficulty)}</span><span>· Digital Electronics</span></div><div class="lab-hero__actions"><button class="button button--light" data-action="stage" data-stage="Theory">▤&nbsp; Start with theory&nbsp; →</button><button class="lab-hero__direct" data-action="stage" data-stage="Pretest">Take the pre-test&nbsp; ↗</button></div></div>
          <aside class="lab-route"><span>YOUR LEARNING ROUTE</span><div class="lab-route__item"><b>01</b><span><strong>Understand</strong><small>Theory and visual diagram</small></span></div><div class="lab-route__item"><b>02</b><span><strong>Try it</strong><small>Procedure and quick checks</small></span></div><div class="lab-route__item"><b>03</b><span><strong>Review</strong><small>Post-test and report</small></span></div></aside>
        </section>
        <section id="lab-workflow" class="workflow"><div class="workflow__head"><div><span class="eyebrow">YOUR LAB · ${safe(lab.category.toUpperCase())}</span><h2>${safe(heading)}</h2><p>${safe(subheading)}</p></div><span class="workflow__count"><strong>${String(stageIndex + 1).padStart(2, "0")}</strong> · ${String(stages.length).padStart(2, "0")} STAGES</span></div>
          <nav class="stepper" aria-label="Experiment stages">${stepButtons}</nav><div class="workflow__content">${renderStage(lab)}</div>
          <footer class="workflow__foot"><button class="quiet-button" data-action="previous" ${stageIndex === 0 ? "disabled" : ""}>← Previous</button><span>Stage ${stageIndex + 1} of ${stages.length}</span><button class="button button--primary button--small" data-action="next">${stageIndex === stages.length - 1 ? "Finish" : `${safe(nextLabel)} →`}</button></footer>
        </section><p class="disclaimer">TattvaLab is an independent learning resource and is not an official Medi-Caps University product or student record.</p></main>${renderFooter()}`;
    }

    function render() {
      document.title = activeSlug ? `${currentLab()?.title || "Lab"} · TattvaLab` : "TattvaLab — Digital Electronics";
      app.innerHTML = activeSlug ? renderLab() : renderHome();
      if (activeSlug) history.replaceState(null, "", `#${activeSlug}/${activeStage.toLowerCase()}`);
      else history.replaceState(null, "", "#home");
    }

    function openLab(slug, stage = "Aim") {
      if (!labs.some((lab) => lab.slug === slug)) return;
      activeSlug = slug;
      activeStage = stage;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function setStage(stage) {
      if (!stages.includes(stage)) return;
      activeStage = stage;
      render();
      document.querySelector("#lab-workflow")?.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function submitQuiz(kind) {
      const lab = currentLab();
      if (!lab) return;
      const questions = kind === "preTest" ? lab.preTest : lab.postTest;
      const state = getQuizState(lab.slug, kind);
      if (!questions.every((question) => state.answers[question.id] !== undefined)) return;
      state.score = questions.reduce((sum, question) => sum + (state.answers[question.id] === question.correctOption ? 1 : 0), 0);
      state.submitted = true;
      render();
    }

    app.addEventListener("click", (event) => {
      const control = event.target.closest("[data-action]");
      if (!control) return;
      const action = control.dataset.action;
      const lab = currentLab();
      if (action === "home") { activeSlug = null; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
      if (action === "catalogue" || action === "paths") {
        if (activeSlug) { activeSlug = null; render(); }
        window.setTimeout(() => document.querySelector(action === "paths" ? "#paths" : "#catalogue")?.scrollIntoView({ behavior: "smooth" }), 20);
      }
      if (action === "open") openLab(control.dataset.slug);
      if (action === "stage") setStage(control.dataset.stage);
      if (action === "previous" && lab) setStage(stages[Math.max(0, stages.indexOf(activeStage) - 1)]);
      if (action === "next" && lab) setStage(stages[Math.min(stages.length - 1, stages.indexOf(activeStage) + 1)]);
      if (action === "answer" && lab) {
        const kind = control.dataset.kind;
        const state = getQuizState(lab.slug, kind);
        const question = (kind === "preTest" ? lab.preTest : lab.postTest)[state.index];
        if (!state.submitted) state.answers[question.id] = Number(control.dataset.option);
        render();
      }
      if (action === "quiz-prev" && lab) { const state = getQuizState(lab.slug, control.dataset.kind); state.index = Math.max(0, state.index - 1); render(); }
      if (action === "quiz-next" && lab) { const state = getQuizState(lab.slug, control.dataset.kind); state.index = Math.min((control.dataset.kind === "preTest" ? lab.preTest : lab.postTest).length - 1, state.index + 1); render(); }
      if (action === "quiz-submit") submitQuiz(control.dataset.kind);
      if (action === "rating" && lab) { feedbackRatings[lab.slug] = Number(control.dataset.rating); render(); }
      if (action === "print") window.print();
    });

    app.addEventListener("submit", (event) => {
      if (event.target.id !== "feedback-form") return;
      event.preventDefault();
      const status = document.querySelector("#feedback-status");
      if (status) status.textContent = "Thanks — your rating is noted for this session.";
    });

    render();
  </script>
</body>
</html>
